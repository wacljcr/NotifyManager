name: build-notify

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid + dpkg
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ENV_HINTS: 1
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew install ldid dpkg || true

      - name: "Compile NotifyManager PreferenceBundle (arm64+arm64e)"
        run: |
          set -e
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iOS SDK: $SDK"
          for arch in arm64 arm64e; do
            clang -x objective-c -arch "$arch" -isysroot "$SDK" -miphoneos-version-min=15.0 \
                  -fobjc-arc -fblocks -O2 -fobjc-exceptions \
                  -c notifymanager/NotifyManager.m -o "NotifyManager_${arch}.o"
            clang -dynamiclib -arch "$arch" -isysroot "$SDK" -miphoneos-version-min=15.0 \
                  -fobjc-exceptions -Wl,-undefined,dynamic_lookup \
                  -install_name "@rpath/NotifyManager.dylib" \
                  -o "NotifyManager_${arch}.dylib" "NotifyManager_${arch}.o"
          done
          lipo -create NotifyManager_arm64.dylib NotifyManager_arm64e.dylib -output NotifyManager.dylib
          file NotifyManager.dylib
          lipo -info NotifyManager.dylib

      - name: "Compile Tweak.dylib (SpringBoard hook + 进程级断网, arm64+arm64e)"
        run: |
          set -e
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          for arch in arm64 arm64e; do
            clang -x objective-c -arch "$arch" -isysroot "$SDK" -miphoneos-version-min=15.0 \
                  -fobjc-arc -fblocks -O2 -fobjc-exceptions \
                  -c notifymanager/Tweak.m -o "Tweak_${arch}.o"
            clang -x objective-c -arch "$arch" -isysroot "$SDK" -miphoneos-version-min=15.0 \
                  -fobjc-arc -fblocks -O2 -fobjc-exceptions \
                  -c notifymanager/NetGuard.m -o "NetGuard_${arch}.o"
            clang -dynamiclib -arch "$arch" -isysroot "$SDK" -miphoneos-version-min=15.0 \
                  -fobjc-exceptions -Wl,-undefined,dynamic_lookup \
                  -install_name "@rpath/NotifyManagerTweak.dylib" \
                  -o "Tweak_${arch}.dylib" "Tweak_${arch}.o" "NetGuard_${arch}.o"
          done
          lipo -create Tweak_arm64.dylib Tweak_arm64e.dylib -output Tweak.dylib
          file Tweak.dylib
          lipo -info Tweak.dylib

      - name: "Re-sign with FakeSIGNER entitlement"
        run: |
          ldid -Snotifymanager/entitlements.plist NotifyManager.dylib
          ldid -Snotifymanager/entitlements.plist Tweak.dylib
          codesign -dvvv NotifyManager.dylib 2>&1 || true
          codesign -dvvv Tweak.dylib 2>&1 || true
          otool -L NotifyManager.dylib
          otool -L Tweak.dylib

      - name: "Package deb (rootless: TweakInject + PreferenceBundles + PreferenceLoader)"
        run: |
          set -e
          VERSION=$(sed -n 's/^Version:[ ]*//p' notifymanager/control)
          BUNDLE=notifymanager/NotifyManager.bundle
          mkdir -p "$BUNDLE"
          cp NotifyManager.dylib "$BUNDLE/NotifyManager"
          cp notifymanager/Info.plist "$BUNDLE/Info.plist"
          # 设置面板图标三件套（规范：29/58/87，入口 plist icon 键=icon.png）
          cp notifymanager/icon.png "$BUNDLE/icon.png"
          cp notifymanager/icon@2x.png "$BUNDLE/icon@2x.png"
          cp notifymanager/icon@3x.png "$BUNDLE/icon@3x.png"
          mkdir -p stage/DEBIAN
          # TweakInject: Tweak.dylib + plist
          mkdir -p "stage/var/jb/usr/lib/TweakInject"
          cp Tweak.dylib "stage/var/jb/usr/lib/TweakInject/NotifyManagerTweak.dylib"
          cp notifymanager/Tweak.plist "stage/var/jb/usr/lib/TweakInject/NotifyManagerTweak.plist"
          # PreferenceBundles
          mkdir -p "stage/var/jb/Library/PreferenceBundles"
          cp -R "$BUNDLE" "stage/var/jb/Library/PreferenceBundles/"
          # PreferenceLoader
          mkdir -p "stage/var/jb/Library/PreferenceLoader/Preferences"
          cp notifymanager/NotifyManager.plist "stage/var/jb/Library/PreferenceLoader/Preferences/NotifyManager.plist"
          # control
          sed "s/^Version:.*/Version: $VERSION/" notifymanager/control > stage/DEBIAN/control
          printf '\n' >> stage/DEBIAN/control
          chmod 755 stage/DEBIAN/control
          dpkg-deb --root-owner-group -b stage NotifyManager.deb
          echo "=== deb layout ==="
          dpkg-deb -c NotifyManager.deb

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotifyManager-deb
          path: NotifyManager.deb

      - name: "Release on tag"
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NotifyManager.deb