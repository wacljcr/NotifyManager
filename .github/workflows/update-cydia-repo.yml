name: Update Cydia Repo

on:
  workflow_run:
    workflows:
      - "build-notify"
    types:
      - completed

jobs:
  update-repo:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Setup
        run: |
          echo "Run ID: ${{ github.event.workflow_run.id }}"
          echo "Event name: ${{ github.event.workflow_run.name }}"
          echo "GH_TOKEN: ***"

      - name: Test GH_TOKEN access to mumu
        run: |
          echo "Testing GH_TOKEN access to wacljcr/mumu..."
          curl -s -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            "https://api.github.com/repos/wacljcr/mumu" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Name:', d.get('full_name')); print('Permissions:', d.get('permissions'))"

      - name: Download NotifyManager deb artifact
        uses: actions/download-artifact@v4
        with:
          name: NotifyManager-deb
          path: ./debs/
          run-id: ${{ github.event.workflow_run.id }}

      - name: Push to mumu repo via API
        run: |
          set -e
          set -x

          REPO="wacljcr/mumu"
          BRANCH="main"
          TOKEN="${{ secrets.GH_TOKEN }}"

          # Function to push a file via GitHub Contents API
          push_file() {
            local path="$1"
            local content_file="$2"

            # Check if file exists to get its SHA
            local sha=""
            local resp
            resp=$(curl -s -H "Authorization: token ${TOKEN}" \
              "https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}")

            if echo "$resp" | grep -q '"sha"'; then
              sha=$(echo "$resp" | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || echo "")
            fi

            # Base64 encode content
            local b64
            b64=$(base64 -w0 "$content_file")

            # Build payload using printf to avoid heredoc issues
            local payload_file="/tmp/payload_$(basename $content_file).json"

            if [ -n "$sha" ]; then
              printf '{"message":"Auto-update %s","content":"%s","sha":"%s"}' "$path" "$b64" "$sha" > "$payload_file"
            else
              printf '{"message":"Auto-update %s","content":"%s"}' "$path" "$b64" > "$payload_file"
            fi

            # Push via API
            local http_code
            http_code=$(curl -s -o /tmp/push_result.txt -w "%{http_code}" \
              -X PUT \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d @"$payload_file" \
              "https://api.github.com/repos/${REPO}/contents/${path}")

            if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
              echo "Pushed: ${path} (HTTP ${http_code})"
            else
              echo "FAILED to push ${path} (HTTP ${http_code})"
              cat /tmp/push_result.txt
              exit 1
            fi
          }

          # Create repo structure locally for generation
          mkdir -p debian/pool/main
          mkdir -p debian/dists/stable/main/binary-all

          # Copy debs to pool
          cp debs/*.deb debian/pool/main/ 2>/dev/null || true

          # Generate Packages file
          cd debian/pool/main
          > ../../dists/stable/main/binary-all/Packages
          for deb in *.deb; do
            [ -f "$deb" ] || continue
            dpkg-deb -f "$deb" >> ../../dists/stable/main/binary-all/Packages
            echo "Filename: ./debian/pool/main/$deb" >> ../../dists/stable/main/binary-all/Packages
            echo "Size: $(stat -c%s "$deb")" >> ../../dists/stable/main/binary-all/Packages
            echo "MD5sum: $(md5sum "$deb" | cut -d' ' -f1)" >> ../../dists/stable/main/binary-all/Packages
            echo "SHA1: $(sha1sum "$deb" | cut -d' ' -f1)" >> ../../dists/stable/main/binary-all/Packages
            echo "SHA256: $(sha256sum "$deb" | cut -d' ' -f1)" >> ../../dists/stable/main/binary-all/Packages
            echo "" >> ../../dists/stable/main/binary-all/Packages
          done
          cd ../../..

          # Create Packages.bz2
          bzip2 -k debian/dists/stable/main/binary-all/Packages
          cp debian/dists/stable/main/binary-all/Packages.bz2 debian/dists/stable/main/binary-all/

          # Create Release file using printf
          {
            echo "Origin: NTM Jailbreak Repo"
            echo "Label: NTM Repo"
            echo "Suite: stable"
            echo "Version: 1.0"
            echo "Codename: ios"
            echo "Architectures: iphoneos-arm64"
            echo "Components: main"
            echo "Description: NTM Jailbreak Repo"
            echo "Support: https://github.com/wacljcr/mumu"
            echo "Date: $(date -R)"
            echo "MD5Sum:"
            echo " $(md5sum debian/dists/stable/main/binary-all/Packages | cut -d' ' -f1) $(stat -c%s debian/dists/stable/main/binary-all/Packages) debian/dists/stable/main/binary-all/Packages"
            echo " $(md5sum debian/dists/stable/main/binary-all/Packages.bz2 | cut -d' ' -f1) $(stat -c%s debian/dists/stable/main/binary-all/Packages.bz2) debian/dists/stable/main/binary-all/Packages.bz2"
            echo "SHA1:"
            echo " $(sha1sum debian/dists/stable/main/binary-all/Packages | cut -d' ' -f1) $(stat -c%s debian/dists/stable/main/binary-all/Packages) debian/dists/stable/main/binary-all/Packages"
            echo " $(sha1sum debian/dists/stable/main/binary-all/Packages.bz2 | cut -d' ' -f1) $(stat -c%s debian/dists/stable/main/binary-all/Packages.bz2) debian/dists/stable/main/binary-all/Packages.bz2"
            echo "SHA256:"
            echo " $(sha256sum debian/dists/stable/main/binary-all/Packages | cut -d' ' -f1) $(stat -c%s debian/dists/stable/main/binary-all/Packages) debian/dists/stable/main/binary-all/Packages"
            echo " $(sha256sum debian/dists/stable/main/binary-all/Packages.bz2 | cut -d' ' -f1) $(stat -c%s debian/dists/stable/main/binary-all/Packages.bz2) debian/dists/stable/main/binary-all/Packages.bz2"
          } > Release

          echo "=== Files ready ==="
          ls -la debian/pool/main/
          ls -la debian/dists/stable/main/binary-all/
          cat Release

          # Push all files
          for deb in debian/pool/main/*.deb; do
            [ -f "$deb" ] || continue
            push_file "debian/pool/main/$(basename $deb)" "$deb"
          done
          push_file "debian/dists/stable/main/binary-all/Packages" "debian/dists/stable/main/binary-all/Packages"
          push_file "debian/dists/stable/main/binary-all/Packages.bz2" "debian/dists/stable/main/binary-all/Packages.bz2"
          push_file "Release" "Release"

          echo "Done!"
