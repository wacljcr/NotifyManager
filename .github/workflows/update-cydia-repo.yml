name: Update Cydia Repo

on:
  workflow_run:
    workflows:
      - "build-notify"
      - "build-tipa"
    types:
      - completed

jobs:
  update-repo:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Setup
        run: |
          echo "Run ID: ${{ github.event.workflow_run.id }}"
          echo "Event name: ${{ github.event.workflow_run.name }}"

      - name: Download CarCheckPlugin deb artifact
        if: ${{ github.event.workflow_run.name == 'build-tipa' }}
        uses: actions/download-artifact@v4
        with:
          name: CarCheckPlugin
          path: ./debs/
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download NotifyManager deb artifact
        if: ${{ github.event.workflow_run.name == 'build-notify' }}
        uses: actions/download-artifact@v4
        with:
          name: NotifyManager-deb
          path: ./debs/

      - name: Push to mumu repo via API
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -e

          REPO="wacljcr/mumu"
          BRANCH="main"

          # Function to push a file via GitHub Contents API
          push_file() {
            local path="$1"
            local content_file="$2"

            # Check if file exists to get its SHA
            local sha=""
            local resp
            resp=$(curl -s -H "Authorization: token ${GH_TOKEN}" \
              "https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}")

            if echo "$resp" | grep -q '"sha"'; then
              sha=$(echo "$resp" | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || echo "")
            fi

            # Base64 encode content
            local b64
            b64=$(base64 -w0 "$content_file")

            # Build payload
            local payload
            if [ -n "$sha" ]; then
              payload=$(cat << EOM
          {"message":"Auto-update ${path}","content":"${b64}","sha":"${sha}"}
          EOM
            )
            else
              payload=$(cat << EOM
          {"message":"Auto-update ${path}","content":"${b64}"}
          EOM
            )
            fi

            # Push via API
            curl -s -X PUT \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "https://api.github.com/repos/${REPO}/contents/${path}" > /dev/null

            echo "Pushed: ${path}"
          }

          # Create repo structure locally for generation
          mkdir -p debian/pool/main
          mkdir -p debian/dists/stable/main/binary-all

          # Copy debs to pool
          cp debs/*.deb debian/pool/main/ 2>/dev/null || true

          # Generate Packages file
          cd debian/pool/main
          > ../../dists/stable/main/binary-all/Packages
          for deb in *.deb; do
            [ -f "$deb" ] || continue
            dpkg-deb -f "$deb" >> ../../dists/stable/main/binary-all/Packages
            echo "Filename: ./debian/pool/main/$deb" >> ../../dists/stable/main/binary-all/Packages
            echo "Size: $(stat -c%s "$deb")" >> ../../dists/stable/main/binary-all/Packages
            echo "MD5sum: $(md5sum "$deb" | cut -d' ' -f1)" >> ../../dists/stable/main/binary-all/Packages
            echo "SHA1: $(sha1sum "$deb" | cut -d' ' -f1)" >> ../../dists/stable/main/binary-all/Packages
            echo "SHA256: $(sha256sum "$deb" | cut -d' ' -f1)" >> ../../dists/stable/main/binary-all/Packages
            echo "" >> ../../dists/stable/main/binary-all/Packages
          done
          cd ../../..

          # Create Packages.bz2
          bzip2 -k debian/dists/stable/main/binary-all/Packages
          cp debian/dists/stable/main/binary-all/Packages.bz2 debian/dists/stable/main/binary-all/

          # Create Release file
          cat > Release << EOF
          Origin: NTM Jailbreak Repo
          Label: NTM Repo
          Suite: stable
          Version: 1.0
          Codename: ios
          Architectures: iphoneos-arm64
          Components: main
          Description: NTM Jailbreak Repo
          Support: https://github.com/wacljcr/mumu
          EOF
          echo "Date: $(date -R)" >> Release
          echo "MD5Sum:" >> Release
          echo " $(md5sum debian/dists/stable/main/binary-all/Packages | cut -d' ' -f1) $(stat -c%s debian/dists/stable/main/binary-all/Packages) debian/dists/stable/main/binary-all/Packages" >> Release
          echo " $(md5sum debian/dists/stable/main/binary-all/Packages.bz2 | cut -d' ' -f1) $(stat -c%s debian/dists/stable/main/binary-all/Packages.bz2) debian/dists/stable/main/binary-all/Packages.bz2" >> Release
          echo "SHA1:" >> Release
          echo " $(sha1sum debian/dists/stable/main/binary-all/Packages | cut -d' ' -f1) $(stat -c%s debian/dists/stable/main/binary-all/Packages) debian/dists/stable/main/binary-all/Packages" >> Release
          echo " $(sha1sum debian/dists/stable/main/binary-all/Packages.bz2 | cut -d' ' -f1) $(stat -c%s debian/dists/stable/main/binary-all/Packages.bz2) debian/dists/stable/main/binary-all/Packages.bz2" >> Release
          echo "SHA256:" >> Release
          echo " $(sha256sum debian/dists/stable/main/binary-all/Packages | cut -d' ' -f1) $(stat -c%s debian/dists/stable/main/binary-all/Packages) debian/dists/stable/main/binary-all/Packages" >> Release
          echo " $(sha256sum debian/dists/stable/main/binary-all/Packages.bz2 | cut -d' ' -f1) $(stat -c%s debian/dists/stable/main/binary-all/Packages.bz2) debian/dists/stable/main/binary-all/Packages.bz2" >> Release

          echo "=== Files ready ==="
          ls -la debian/pool/main/
          ls -la debian/dists/stable/main/binary-all/

          # Push all files
          for deb in debian/pool/main/*.deb; do
            [ -f "$deb" ] || continue
            push_file "debian/pool/main/$(basename $deb)" "$deb"
          done
          push_file "debian/dists/stable/main/binary-all/Packages" "debian/dists/stable/main/binary-all/Packages"
          push_file "debian/dists/stable/main/binary-all/Packages.bz2" "debian/dists/stable/main/binary-all/Packages.bz2"
          push_file "Release" "Release"

          echo "Done!"
