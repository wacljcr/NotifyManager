name: Update Cydia Repo

on:
  workflow_run:
    workflows:
      - "build-notify"
    types:
      - completed

jobs:
  update-repo:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Clone mumu repo
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/wacljcr/mumu.git" mumu
          ls -la mumu/

      - name: Download NotifyManager deb artifact
        uses: actions/download-artifact@v4
        with:
          name: NotifyManager-deb
          path: ./debs/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GH_TOKEN }}

      - name: Place deb and regenerate index
        run: |
          set -e
          # 放进源的 debs/ 目录（覆盖旧版本）
          cp debs/*.deb mumu/debs/
          echo "=== debs/ ==="
          ls -la mumu/debs/ | grep -i notify

          # 用源自带的 gen_packages.py 生成索引
          cd mumu
          python3 gen_packages.py
          echo "=== index files ==="
          ls -la Packages Packages.bz2 Release 2>/dev/null || true

          # 验证版本号已写入
          grep -A2 "Package: com.ntm.notifymanager" Packages | head -6

      - name: Commit and push
        run: |
          set -e
          cd mumu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes" || git commit -m "Auto-build NotifyManager: $(date +'%Y-%m-%d %H:%M')"
          git push
